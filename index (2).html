*{box-sizing:border-box}html,body{margin:0}

nav a{padding:10px 16px;border-radius:99px;text-decoration:none;color:var(--tx);white-space:nowrap;font-weight:700;font-size:15px;background:var(--card);border:1px solid var(--bd)}

.k:nth-child(2n){border-top-color:var(--ac)}.k:nth-child(3){border-top-color:var(--bl)}
h1{font-size:23px;margin:6px 0 12px;font-weight:800;color:var(--dk)}
h2{font-size:18px;margin:26px 0 12px;font-weight:800;border-left:6px solid var(--ac);padding-left:10px}
.bar{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:14px}
.bar span:first-child{width:110px}.tr{flex:1;height:18px;background:var(--bd);border-radius:9px;position:relative;overflow:hidden}

.trk{position:absolute;bottom:14px;width:190px;z-index:3;animation:cross 20s linear infinite;filter:drop-shadow(0 6px 8px #0004)}
@keyframes cross{from{left:-210px}to{left:100%}}
.wh{transform-box:fill-box;transform-origin:center;animation:sp 3s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes up{from{opacity:0;transform:translateY(14px)}}
#bgfx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#bgfx>*{position:absolute;left:0;opacity:.3;will-change:transform;animation:drive linear infinite;border-radius:10px}

@keyframes drive{from{transform:translateX(-45vw)}to{transform:translateX(110vw)}}

<script>
const K='dafonte_av2',$=i=>document.getElementById(i),R=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
let D={sales:[],reqs:[],cobs:[]};try{D=Object.assign(D,JSON.parse(localStorage.getItem(K))||{})}catch(e){}
let DB=null,UID=null,ME=null,ADM=false,OK=false,BOOT=false,TEAM=[],APPR=new Set(),snap={},EDIT=null;
const ROLES=['Analista comercial','Gerente de filial','Equipe da matriz','Gerente da matriz'];
function save(){if(!DB){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}return}
for(const c of['sales','reqs','cobs']){const ids=new Set();D[c].forEach(x=>{const k=c+'/'+x.id,j=JSON.stringify(x);ids.add(k);if(snap[k]!==j){snap[k]=j;DB.collection(c).doc(String(x.id)).set(JSON.parse(j)).catch(()=>{})}});
Object.keys(snap).filter(k=>k.startsWith(c+'/')&&!ids.has(k)).forEach(k=>{delete snap[k];DB.collection(c).doc(k.split('/')[1]).delete().catch(()=>{})})}}
const isM=()=>ADM||(ME&&ME.local)||(ME&&['Equipe da matriz','Gerente da matriz'].includes(ME.role));
const mine=s=>isM()||(ME.fi&&String(s.fi||'').trim().toLowerCase()==ME.fi.trim().toLowerCase());
const SV=()=>D.sales.filter(mine),RV=()=>D.reqs.filter(r=>mine(sale(r.sid))),CV=()=>D.cobs.filter(c=>{const r=D.reqs.find(x=>x.id==c.rid);return r&&mine(sale(r.sid))});
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.toISOString().slice(0,10),today=()=>iso(new Date()),fd=s=>s?new Date(s+'T12:00:00').toLocaleDateString('pt-BR'):'—';
function addBiz(s,n){const d=new Date(s+'T12:00:00');while(n>0){d.setDate(d.getDate()+1);if(d.getDay()%6)n--}return iso(d)}
const diff=(a,b)=>Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/864e5);
const rec=s=>s.pg.reduce((a,p)=>a+p.v,0),adv=s=>s.total*s.ap/100,sal=s=>Math.max(0,s.total-rec(s));
const sit=s=>rec(s)>=s.total-.005?'Quitada':rec(s)>0?'Parcial':'Pendente';
const sale=id=>D.sales.find(s=>s.id==id)||{cl:'?',md:'',total:0,pg:[],ap:0};
const prazo=r=>r.comp?addBiz(r.comp,5):null;
function pst(r){const p=prazo(r);if(r.cad)return cadOk(r)?['Cadastrada no prazo','q']:['Cadastrada fora do prazo','v'];
if(!p)return['Prazo não iniciado (aguardando informações completas)','n'];const d=diff(p,today());return d<0?['Prazo interno vencido','v']:d<=2?['Próximo do vencimento','n']:['Dentro do prazo','p']}
const cadOk=r=>r.cad<=prazo(r);
const BNB=['Cadastro realizado','Aguardando documentação','Em análise','Aguardando atualização','Aprovada','Em processamento','Crédito previsto','Recebimento parcial','Recebimento confirmado','Suspensa','Cancelada'];
const MOD=['TOKEN','AF','Recurso próprio'];
const pages={painel:'Painel',vendas:'Vendas',solicitacoes:'Solicitações à matriz',bnb:'Acompanhamento BNB',relatorios:'Análises e relatórios'};
const pill=(t,c)=>`<span class="t ${c}">${t}</span>`;
const kpi=a=>a.map(k=>`<div class="c k"><small>${k[0]}</small><b>${k[1]}</b></div>`).join('');
const sum=(L,f)=>L.reduce((a,x)=>a+f(x),0);
function bars(L){const mx=Math.max(1,...MOD.map(x=>sum(L.filter(s=>s.md===x),s=>s.total)));
return L.length?MOD.map(x=>{const M=L.filter(s=>s.md===x),a=sum(M,s=>s.total),b=sum(M,rec);return `<div class="bar"><span>${x}</span><div class="tr"><i style="width:${a/mx*100}%;background:var(--ac)"></i><i style="width:${b/mx*100}%;background:var(--gr)"></i></div><span style="width:auto">${R(a)} / ${R(b)}</span></div>`}).join('')+'<div class="mu">Barra amarela: vendido · barra preta: recebido</div>':'<div class="mu">Sem dados. Registre vendas ou carregue a demonstração na página Vendas.</div>'}
function reqKpi(){const q=RV(),st=q.map(r=>pst(r)[0]);return [['Solicitações',q.length],['Aguardando cadastro',q.filter(r=>!r.cad).length],['Próximas do vencimento',st.filter(x=>x=='Próximo do vencimento').length],['Prazo vencido',st.filter(x=>x=='Prazo interno vencido').length]]}
const salesKpi=L=>[['Total vendido',R(sum(L,s=>s.total))],['Total recebido',R(sum(L,rec))],['Saldo a receber',R(sum(L,sal))],['Adiant. previstos',R(sum(L,s=>s.advOk?0:adv(s)))],['Adiant. recebidos',R(sum(L,s=>s.advOk?adv(s):0))],['Vendas',L.length]];
const F={q:'',m:'',s:''};
const view=()=>SV().filter(s=>(!F.q||(s.cl+s.mo).toLowerCase().includes(F.q.toLowerCase()))&&(!F.m||s.md===F.m)&&(!F.s||sit(s)===F.s));
function filt(){return `<div class="row noprint"><input id="fq" placeholder="Buscar cliente ou modelo" value="${esc(F.q)}"><select id="fm"><option value="">Todas modalidades</option>${MOD.map(m=>`<option ${F.m==m?'selected':''}>${m}</option>`).join('')}</select><select id="fs"><option value="">Todas situações</option>${['Pendente','Parcial','Quitada'].map(m=>`<option ${F.s==m?'selected':''}>${m}</option>`).join('')}</select></div>`}
function salesTable(L,act){return `<div class="c tw"><table><thead><tr><th>Data</th><th>Cliente</th><th>Filial</th><th>Modelo</th><th>Modalidade</th><th>Total</th><th>Adiant. prev.</th><th>Recebido</th><th>Saldo</th><th>Situação</th>${isM()?'<th>Cadastrado por</th>':''}${act?'<th class="noprint">Ações</th>':''}</tr></thead><tbody>${L.length?L.map(s=>{const st=sit(s);return `<tr><td>${fd(s.dt)}</td><td>${esc(s.cl)}${s.demo?' <span class="mu">(demo)</span>':''}</td><td>${esc(s.fi)}</td><td>${esc(s.mo)}</td><td>${s.md}</td><td>${R(s.total)}</td><td>${R(adv(s))} ${s.advOk?'✓':''}</td><td>${R(rec(s))}</td><td>${R(sal(s))}</td><td>${pill(st,st=='Quitada'?'q':st=='Parcial'?'p':'n')}</td>${isM()?`<td>${esc(s.por||'—')}</td>`:''}${act?`<td class="noprint">${st!='Quitada'?`<button class="s" data-a="pay" data-i="${s.id}">Receber</button> `:''}${s.ap>0&&!s.advOk?`<button class="s" data-a="adv" data-i="${s.id}">Confirmar adiant.</button>`:''} <button class="s" data-a="edit" data-i="${s.id}">Editar</button> <button class="s" data-a="del" data-i="${s.id}">Excluir</button></td>`:''}</tr>`}).join(''):'<tr><td colspan="12">Nenhuma venda encontrada.</td></tr>'}</tbody></table></div>`}
const P={
painel(){return hero()+`<h2>Resumo financeiro</h2><div class="grid">${kpi(salesKpi(SV()))}</div><h2>Matriz e prazos</h2><div class="grid">${kpi(reqKpi())}</div><h2>Vendido x recebido por modalidade</h2><div class="c">${bars(SV())}</div>${devedores()}`},
vendas(){const E=EDIT?by('sales',EDIT):null;return `<h1>${E?'Editar venda':'Vendas'}</h1><div class="c"><div class="fm"><input id="cl" placeholder="Cliente" value="${E?esc(E.cl):''}"><input id="fi" placeholder="Filial (cidade/UF)" value="${E?esc(E.fi):isM()?'':esc(ME.fi)}" ${isM()?'':'readonly'}><input id="mo" placeholder="Modelo do trator" value="${E?esc(E.mo):''}"><select id="md">${MOD.map(m=>`<option${E&&E.md==m?' selected':''}>${m}</option>`).join('')}</select><input id="vt" type="number" min="0" step="0.01" placeholder="Valor total (R$)" value="${E?E.total:''}"><input id="ap" type="number" min="0" max="100" placeholder="Adiantamento (%)" value="${E?E.ap:''}"></div><div class="row"><button data-a="${E?'upd':'add'}"${E?` data-i="${E.id}"`:''}>${E?'Salvar alterações':'Registrar venda'}</button>${E?'<button class="s" data-a="cancel">Cancelar</button>':''}<span id="er" style="color:var(--rd)"></span></div></div><h2>Lista</h2>${filt()}<div class="row noprint"><button class="s" data-a="demo">Carregar demonstração</button><button class="s" data-a="undemo">Remover demonstração</button></div>${salesTable(view(),true)}<p class="mu">Adiantamento combinado só conta como recebido após confirmação.</p>`},
solicitacoes(){const free=SV().filter(s=>s.md!='Recurso próprio'&&!D.reqs.some(r=>r.sid==s.id));
return `<h1>Solicitações à matriz</h1><div class="c"><p class="mu" style="margin-top:0">Prazo interno de 5 dias úteis (sábados e domingos excluídos; feriados ainda não configurados), contado a partir das informações completas.</p><div class="row"><select id="rs">${free.length?free.map(s=>`<option value="${s.id}">${esc(s.cl)} · ${s.md} · ${R(s.total)}</option>`).join(''):'<option value="">Nenhuma venda TOKEN/AF sem solicitação</option>'}</select><button data-a="req" ${free.length?'':'disabled'}>Enviar à matriz</button></div></div>${mailBox()}<h2>Solicitações</h2><div class="c tw"><table><thead><tr><th>Cliente</th><th>Modal.</th><th>Envio</th><th>Info completas</th><th>Prazo</th><th>Situação</th><th>Status</th><th>Ações</th></tr></thead><tbody>${RV().length?RV().map(r=>{const s=sale(r.sid),p=pst(r);return `<tr><td>${esc(s.cl)}</td><td>${r.md}</td><td>${fd(r.env)}</td><td>${fd(r.comp)}</td><td>${fd(prazo(r))}</td><td>${pill(p[0],p[1])}</td><td>${r.st}</td><td>${r.cad||!isM()?'':`<button class="s" data-a="comp" data-i="${r.id}">Info completas</button> <button class="s" data-a="pend" data-i="${r.id}">Pedir complementação</button> <button class="s" data-a="cad" data-i="${r.id}" ${r.comp?'':'disabled'}>Cadastrar</button> `} ${mailLink(r)}</td></tr>`}).join(''):'<tr><td colspan="8">Nenhuma solicitação.</td></tr>'}</tbody></table></div><p class="mu">O prazo interno não é o prazo bancário.</p>`},
bnb(){return `<h1>Acompanhamento BNB</h1><div class="c tw"><table><thead><tr><th>Cliente</th><th>Modal.</th><th>Valor previsto</th><th>Cadastro matriz</th><th>Status</th><th>Crédito estimado</th><th></th></tr></thead><tbody>${RV().length?RV().map(r=>{const s=sale(r.sid);return `<tr><td>${esc(s.cl)}</td><td>${r.md}</td><td>${R(s.total-(s.advOk?adv(s):0))}</td><td>${r.cad?fd(r.cad):'Aguardando'}</td><td>${r.cad?`<select data-a="bs" data-i="${r.id}" ${isM()?'':'disabled'}>${BNB.map(b=>`<option ${r.bnb==b?'selected':''}>${b}</option>`).join('')}</select>`:'Aguardando cadastro pela matriz'}</td><td>${r.est?fd(r.est):'<span class="mu">Previsão indisponível — faltam informações sobre o prazo ou o andamento da operação.</span>'}</td><td><button class="s" data-a="est" data-i="${r.id}" ${r.cad&&isM()?'':'disabled'}>Informar data</button></td></tr>`}).join(''):'<tr><td colspan="7">Envie uma solicitação TOKEN ou AF para acompanhar.</td></tr>'}</tbody></table></div><p class="mu">Datas são informadas manualmente por usuário autorizado; nada aqui é prazo oficial do banco. Aprovada não significa recebida; o recebimento é registrado na página Vendas.</p>`},
relatorios(){const L=view();return `<h1>Análises e relatórios</h1><p class="mu">Gerado em ${new Date().toLocaleString('pt-BR')}</p>${filt()}<div class="grid">${kpi(salesKpi(L))}</div><h2>Por modalidade</h2><div class="c">${bars(L)}</div><h2>Prazos da matriz</h2><div class="grid">${kpi(reqKpi())}<div class="c k"><small>Cadastradas no prazo</small><b>${RV().filter(r=>r.cad&&cadOk(r)).length}</b></div><div class="c k"><small>Cadastradas fora do prazo</small><b>${RV().filter(r=>r.cad&&!cadOk(r)).length}</b></div></div><h2>Vendas</h2>${salesTable(L,false)}<div class="row noprint"><button class="s" data-a="csv">Exportar Excel (CSV)</button><button data-a="pdf">Exportar análise em PDF</button></div>`}};
function hero(){const L=SV(),v=sum(L,s=>s.total),r=sum(L,rec),pc=v?Math.round(r/v*100):0;
return `<section class="hero"><div class="hx"><span class="tag">DAFONTE TRATORES · VALTRA</span><h1>Do campo ao caixa:<br><em>cada venda, cada pagamento.</em></h1><p>Vendas, adiantamentos, prazos da matriz e recebimentos com clareza.</p><div class="row"><a class="cta" href="#vendas">+ Nova venda</a><a class="cta g" href="#relatorios">Ver análises</a></div><div class="big"><b>${R(r)}</b><span class="mu">recebido · ${pc}% de ${R(v)} vendidos</span><div class="pb"><i style="width:${pc}%"></i></div></div></div><svg class="field" viewBox="0 0 800 150" preserveAspectRatio="none" aria-hidden="true"><path d="M0 50Q150 0 320 45T800 30V150H0Z" fill="#c98f00"/><path d="M0 85Q200 40 400 80T800 65V150H0Z" fill="#f2b705"/><path d="M0 120Q250 90 500 118T800 108V150H0Z" fill="#1a1a1a"/></svg><svg class="trk" viewBox="0 0 220 130" aria-hidden="true"><g fill="#111"><rect x="30" y="62" width="120" height="28" rx="8"/><path d="M100 62V26h42l20 36z"/><rect x="44" y="38" width="9" height="26" rx="3"/></g><path d="M108 33h28l13 24h-41z" fill="#f2b705" opacity=".95"/><g class="wh"><circle cx="150" cy="92" r="32" fill="#1a1a1a" stroke="#fff" stroke-width="5"/><circle cx="150" cy="92" r="11" fill="#f2b705"/><path d="M150 62v60M120 92h60M129 71l42 42M171 71l-42 42" stroke="#fff" stroke-width="3"/></g><g class="wh"><circle cx="56" cy="104" r="18" fill="#1a1a1a" stroke="#fff" stroke-width="4"/><circle cx="56" cy="104" r="6" fill="#f2b705"/><path d="M56 86v36M38 104h36" stroke="#fff" stroke-width="3"/></g></svg></section>`}
function devedores(){const m={};SV().forEach(s=>{const k=s.cl.trim().toLowerCase();(m[k]=m[k]||{n:s.cl.trim(),t:0,r:0,q:0}).t+=s.total;m[k].r+=rec(s);m[k].q++});
const L=Object.values(m).map(x=>({...x,f:Math.max(0,x.t-x.r)})).sort((a,b)=>b.f-a.f);
return `<h2>Quanto cada cliente ainda falta pagar</h2>`+(L.length?`<div class="grid">${L.map(x=>{const pc=x.t?Math.round(x.r/x.t*100):0;return `<div class="c k"><small>${esc(x.n)} · ${x.q} venda${x.q>1?'s':''}</small><b>${x.f>0?R(x.f):'Quitado ✓'}</b><div class="pb" style="background:var(--bd)"><i style="width:${pc}%"></i></div><span class="mu">Pago ${R(x.r)} de ${R(x.t)} (${pc}%)</span></div>`}).join('')}</div>`:'<div class="c mu">Sem clientes ainda. Registre uma venda na página Vendas.</div>')}
function fotosBox(){return false?`<h2>Fotos dos tratores (fundo animado)</h2><div class="c"><div class="row"><input type="file" id="ff" accept="image/*" multiple><button data-a="fotos">Enviar fotos</button><button class="s" data-a="nofotos">Voltar ao desenho</button></div><p class="mu">Use apenas fotos que a Dafonte tem direito de usar. Sem fotos enviadas, passam as fotos padrão de tratores Valtra.</p><span id="fe" class="mu"></span></div>`:''}

let BG=[];

if(!OK)return `<h1>Cadastro enviado</h1><div class="c">Olá, ${esc(ME.nome)}.</div>`;return''}

else if(a=='upd'){const s=by('sales',i),t=+$('vt').value,p=+$('ap').value||0;if(!s)return;if(!$('cl').value.trim()||!$('fi').value.trim()||!$('mo').value.trim()||!(t>0)){$('er').textContent='Preencha cliente, filial, modelo e valor.';return}if(p<0||p>100){$('er').textContent='Adiantamento entre 0 e 100%.';return}Object.assign(s,{cl:$('cl').value.trim(),fi:$('fi').value.trim(),mo:$('mo').value.trim(),md:$('md').value,total:t,ap:p});EDIT=null;done()}
else if(a=='del'){const s=by('sales',i);if(!s||!confirm('Excluir a venda de '+s.cl+'? As solicitações e cobranças dessa venda também serão apagadas.'))return;const rs=D.reqs.filter(r=>r.sid==s.id),cs=D.cobs.filter(c=>rs.some(r=>r.id==c.rid));D.cobs=D.cobs.filter(c=>!cs.includes(c));D.reqs=D.reqs.filter(r=>!rs.includes(r));D.sales=D.sales.filter(x=>x!==s);if(EDIT==s.id)EDIT=null;if(DB){(async()=>{for(const[c,l]of[['cobs',cs],['reqs',rs],['sales',[s]]])for(const x of l){delete snap[c+'/'+x.id];try{await DB.collection(c).doc(String(x.id)).delete()}catch(e){}}})();render()}else done()}
else if(a=='adv'){const s=by('sales',i);s.pg.push({v:adv(s)});s.advOk=true;done()}
else if(a=='pay'){const s=by('sales',i);ask('Receber de '+s.cl+' (saldo '+R(sal(s))+')','Valor recebido (R$)',v=>{v=parseFloat(v.replace(',','.'));if(v>0){s.pg.push({v:Math.min(v,sal(s))});done()}})}
else if(a=='req'){const s=by('sales',$('rs').value);if(s)D.reqs.push({id:Date.now(),sid:s.id,md:s.md,env:T,comp:null,st:'Enviada à matriz',cad:null,bnb:'Cadastro realizado',est:''});done()}
else if(a=='comp'){const r=by('reqs',i);r.comp=T;r.st='Informações completas recebidas';done()}
else if(a=='pend'){const r=by('reqs',i);r.comp=null;r.st='Aguardando complementação de informações';done()}
else if(a=='cad'){const r=by('reqs',i);r.cad=T;r.st='Cadastrada oficialmente';done()}
else if(a=='est'){ask('Data estimada de crédito (AAAA-MM-DD)','2026-11-30',v=>{if(/^\d{4}-\d{2}-\d{2}$/.test(v)){by('reqs',i).est=v;done()}})}
else if(a=='demo'){if(D.sales.some(s=>s.demo))return;const n=Date.now(),mk=(k,c,f,m,md,t,p,ok,pg)=>({id:n+k,dt:T,cl:c,fi:f,mo:m,md,total:t,ap:p,advOk:ok,pg:pg||[],demo:true});
const A=[mk(1,'Fazenda Boa Vista','Recife/PE','Valtra BH 180','TOKEN',200000,10,true),mk(2,'Agro Sertão','Petrolina/PE','Valtra A114','AF',150000,0,false),mk(3,'Sítio Primavera','Salvador/BA','Valtra A134','Recurso próprio',120000,20,true,[{v:24000},{v:30000}])];A[0].pg=[{v:20000}];D.sales.push(...A);
D.reqs.push({id:n+11,sid:n+1,md:'TOKEN',env:iso(new Date(Date.now()-14*864e5)),comp:iso(new Date(Date.now()-12*864e5)),st:'Informações completas recebidas',cad:null,bnb:'Cadastro realizado',est:'',demo:true},{id:n+12,sid:n+2,md:'AF',env:T,comp:T,st:'Informações completas recebidas',cad:null,bnb:'Cadastro realizado',est:'',demo:true});done()}
else if(a=='undemo'){D.sales=D.sales.filter(s=>!s.demo);D.reqs=D.reqs.filter(r=>!r.demo);D.cobs=D.cobs.filter(c=>D.reqs.some(r=>r.id==c.rid));done()}
else if(a=='relog'){fetch('/api/logout',{method:'POST'}).then(()=>location.reload());return;ME=null;REG='';if(DB)DB.doc('profiles/'+UID).delete().catch(()=>{});else try{localStorage.removeItem('dafonte_me')}catch(x){}render()}
else if(a=='role'){REG=i||'';render()}
else if(a=='reg'){const g=x=>$(x).value.trim(),n=g('rn'),em=g('re'),tl=g('rt').replace(/\D/g,''),f=g('rf'),er=$('er');if(n.length<5||!n.includes(' ')){er.textContent='Informe o nome completo.';return}if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){er.textContent='E-mail inválido.';return}if(tl.length<10){er.textContent='Informe o telefone com DDD.';return}if(!f){er.textContent='Informe a filial.';return}const rl=(document.querySelector('input[name=rl]:checked')||{}).value||'Analista comercial',pw=$('rp').value;if(pw.length<6){er.textContent='A senha precisa ter ao menos 6 caracteres.';return}er.textContent='Enviando…';fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome:n,email:em,tel:g('rt'),mat:g('rm'),fi:f,role:rl,senha:pw,codigo:$('rc').value.trim()})}).then(r=>r.json().then(j=>({ok:r.ok,j}))).then(x=>{if(x.ok)location.reload();else er.textContent=x.j.erro||'Não foi possível cadastrar.'}).catch(()=>{er.textContent='Sem conexão com o servidor.'})}
else if(a=='login'){const m=$('el'),e=$('le').value.trim(),p=$('lp').value;if(!e||!p){m.textContent='Informe e-mail e senha.';return}m.textContent='Entrando…';fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e,senha:p})}).then(r=>r.json().then(j=>({ok:r.ok,j}))).then(x=>{if(x.ok)location.reload();else m.textContent=x.j.erro||'Não foi possível entrar.'}).catch(()=>{m.textContent='Sem conexão com o servidor.'})}
else if(a=='apr'){DB.collection('approvals').doc(i).set({ok:true}).catch(()=>{})}
else if(a=='rev'){DB.collection('approvals').doc(i).delete().catch(()=>{})}
else if(a=='mail'){const v=$('ml').value.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){$('me').textContent='E-mail inválido.';return}MAIL=v;try{localStorage.setItem('dafonte_mail',v)}catch(e){}if(DB&&ADM)DB.doc('config/mail').set({to:v}).catch(()=>{});render()}
else if(a=='fotos'){(async()=>{const fs=[...($('ff').files||[])].slice(0,8),e=$('fe');if(!fs.length){e.textContent='Escolha as fotos primeiro.';return}try{const as=await claude.use('assets');if(!as){e.textContent='Envio de fotos indisponível para sua conta.';return}e.textContent='Enviando…';const ids=[];for(const f of fs)ids.push((await as.upload(f)).id);await DB.doc('config/bg').set({ids:[...BG,...ids].slice(-12)});e.textContent='Fotos enviadas.'}catch(x){e.textContent='Não foi possível enviar.'}})()}
else if(a=='nofotos'){DB.doc('config/bg').set({ids:[]}).catch(()=>{})}
else if(a=='pdf'){const t=document.title;document.title='Relatorio-Dafonte-'+new Date().toISOString().slice(0,10);print();document.title=t}
else if(a=='csv'){const rows=[['Data','Cliente','Filial','Modelo','Modalidade','Total','Adiant. previsto','Recebido','Saldo','Situação'],...view().map(s=>[fd(s.dt),s.cl,s.fi,s.mo,s.md,s.total,adv(s),rec(s),sal(s),sit(s)])];
const c=rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\n'),l=document.createElement('a');l.href=URL.createObjectURL(new Blob(['\ufeff'+c],{type:'text/csv'}));l.download='vendas-dafonte.csv';l.click()}});
render();
(async()=>{try{if(window.claude){const u=await claude.use('user');DB=await claude.use('db');if(u&&DB){UID=await u.id();ADM=!!(u.isOwner()||u.canEdit());D={sales:[],reqs:[],cobs:[]};['sales','reqs','cobs'].forEach(sub);DB.doc('config/bg').onSnapshot(s=>{BG=((s.data()||{}).ids)||[];paintBg()},()=>{});DB.doc('config/mail').onSnapshot(s=>{MAIL=((s.data()||{}).to)||MAIL;rr()},()=>{});
DB.collection('profiles').onSnapshot(s=>{TEAM=s.docs.map(d=>d.data());{const f=TEAM.find(x=>x.uid==UID);ME=f&&f.email?f:(ME&&ME.email?ME:null)}rr()},()=>{});
DB.collection('approvals').onSnapshot(s=>{APPR=new Set(s.docs.map(d=>d.id));OK=true;rr()},()=>{})}else DB=null}}catch(e){DB=null}
if(!DB){try{ME=JSON.parse(localStorage.getItem('dafonte_me'))}catch(e){}ADM=true;OK=true}
BOOT=true;paintBg();render()})();
</script>
