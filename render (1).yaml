databases:
  - name: dafonte-db
    databaseName: dafonte
    plan: free
services:
  - type: web
    name: dafonte-vendas
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dafonte-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: MATRIZ_CODE
        sync: false
